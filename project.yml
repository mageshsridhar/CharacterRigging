name: CharacterRigging
options:
  bundleIdPrefix: dev.characterrigging
  deploymentTarget: { iOS: "18.0" }
packages:
  RiveRuntime: { url: https://github.com/rive-app/rive-ios, exactVersion: 6.30.1 }
targets:
  CharacterRigging:
    type: application
    scheme: { testTargets: [CharacterRiggingTests] }
    platform: iOS
    sources: [App]
    dependencies: [{ package: RiveRuntime }]
    info:
      path: App/Support/Info.plist
      properties:
        # Lets the springs run at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Character
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"
  CharacterRiggingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: CharacterRigging }]
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
